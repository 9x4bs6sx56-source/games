<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Sort</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --border: #2e2c28;
    --text: #e8e4dc;
    --muted: #7a7670;
    --accent: #c8a96e;
    --win: #6ec8a9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 12px 60px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
    pointer-events: none; z-index: 0;
  }

  header {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem; letter-spacing: -0.02em;
    color: var(--accent);
  }

  #moves-display { color: var(--text); font-size: 0.82rem; }

  #level-bar {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    display: flex; align-items: center; justify-content: space-between;
    margin: 8px 0 4px; gap: 10px;
  }

  #level-label {
    font-size: 0.7rem; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    white-space: nowrap;
  }

  #diff-badge {
    font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 20px; border: 1px solid;
  }
  #diff-badge.easy   { color: #6ec8a9; border-color: #6ec8a9; }
  #diff-badge.medium { color: #c8b96e; border-color: #c8b96e; }
  #diff-badge.hard   { color: #c87a6e; border-color: #c87a6e; }
  #diff-badge.expert { color: #a96ec8; border-color: #a96ec8; }
  #diff-badge.insane { color: #e05c5c; border-color: #e05c5c; }

  #msg-area {
    position: relative; z-index: 1;
    height: 20px; font-size: 0.7rem;
    color: var(--muted); letter-spacing: 0.08em;
    margin-bottom: 4px;
    transition: opacity 0.3s;
  }

  #game-area {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    display: flex; flex-wrap: wrap;
    gap: 10px; justify-content: center;
    margin-bottom: 24px;
  }

  .tube-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; cursor: pointer;
    position: relative; z-index: 2;
    transition: transform 0.15s ease;
  }

  .tube-wrap.selected { transform: translateY(-10px); }
  .tube-wrap.done { opacity: 0.55; pointer-events: none; }

  .tube-wrap.shake {
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(5px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .tube {
    width: 52px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 0 0 26px 26px;
    padding: 6px 6px 8px;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    min-height: 180px;
  }

  .tube-wrap.selected .tube { border-color: var(--accent); }
  .tube-wrap.done .tube { border-color: var(--win); }

  .ball {
    width: 40px; height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }

  .controls {
    position: relative; z-index: 1;
    display: flex; gap: 10px;
    flex-wrap: wrap; justify-content: center;
    margin-bottom: 16px;
  }

  button {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  button:hover { color: var(--text); border-color: var(--muted); }
  button#next-btn {
    border-color: var(--accent); color: var(--accent);
  }

  /* Level select */
  #level-select {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    display: none;
    flex-wrap: wrap;
    gap: 8px; justify-content: center;
    margin-top: 8px;
  }
  #level-select.open { display: flex; }

  .lvl-btn {
    width: 44px; height: 44px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    border-radius: 6px;
  }
  .lvl-btn.unlocked { color: var(--text); border-color: var(--border); }
  .lvl-btn.current  { color: var(--accent); border-color: var(--accent); }
  .lvl-btn.locked   { color: var(--border); border-color: var(--border); pointer-events: none; }
  .lvl-btn.done-lv  { color: var(--win); border-color: var(--win); }

  /* Win overlay */
  #win-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15,14,12,0.88);
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    font-family: 'Playfair Display', serif;
  }
  #win-overlay.show { display: flex; }

  #win-overlay h2 {
    font-size: 2rem; color: var(--win);
    letter-spacing: -0.02em;
  }
  #win-overlay .sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  #win-overlay button {
    margin-top: 8px;
    border-color: var(--win); color: var(--win);
    font-size: 0.8rem; padding: 10px 28px;
  }
</style>
</head>
<body>

<header>
  <h1>Ball Sort</h1>
  <span id="moves-display">moves: 0</span>
</header>

<div id="level-bar">
  <span id="level-label">level 1 / 60</span>
  <span id="diff-badge" class="easy">easy</span>
</div>

<div id="msg-area"></div>

<div id="game-area"></div>

<div class="controls">
  <button id="undo-btn">↩ undo</button>
  <button id="restart-btn">↺ restart</button>
  <button id="next-btn">next →</button>
  <button id="levels-btn">levels</button>
</div>

<div id="level-select"></div>

<div id="win-overlay">
  <h2 id="win-title">solved!</h2>
  <div class="sub" id="win-sub"></div>
  <button id="win-next-btn">next level →</button>
</div>

<script>
// ── Palette ────────────────────────────────────────────────────────────────────
const COLORS = [
  ['#e05c5c','#f07a7a','#b03a3a'], // red
  ['#5c9be0','#7ab4f0','#3a72b0'], // blue
  ['#5ce08a','#7af0a8','#3ab060'], // green
  ['#e0c05c','#f0d67a','#b09030'], // yellow
  ['#c05ce0','#d87af0','#9030b0'], // purple
  ['#e07a5c','#f09a7a','#b05030'], // orange
  ['#5cd4e0','#7ae8f0','#3aa0b0'], // cyan
  ['#e05ca0','#f07ac0','#b03070'], // pink
  ['#8a8a5c','#a8a87a','#606030'], // olive
  ['#5c5ce0','#7a7af0','#3030b0'], // indigo
];

function ballStyle(colorIdx) {
  const [mid, hi, lo] = COLORS[colorIdx];
  return `background: radial-gradient(circle at 35% 32%, ${hi} 0%, ${mid} 48%, ${lo} 100%);`;
}

// ── Level definitions [numColors, numEmpty, tubeDepth] ────────────────────────
// 60 levels: easy → medium → hard → expert → insane
const LEVELS = [
  // Easy (1-10)
  [3,2,3],[3,2,3],[4,2,3],[4,2,3],[3,2,4],
  [4,2,4],[4,2,4],[5,2,4],[5,2,4],[4,2,4],
  // Medium (11-20)
  [5,2,4],[6,2,4],[6,2,4],[5,2,5],[5,2,5],
  [6,2,5],[6,2,5],[7,2,4],[7,2,5],[6,2,5],
  // Hard (21-32)
  [7,2,5],[7,2,5],[8,2,5],[8,2,5],[7,3,5],
  [8,3,5],[9,2,5],[9,2,5],[8,2,5],[9,3,5],
  [8,2,6],[9,2,6],
  // Expert (33-46)
  [9,2,5],[10,2,5],[9,3,5],[10,3,5],[10,2,5],
  [10,2,6],[9,2,6],[10,3,6],[10,2,6],[9,3,6],
  [10,2,6],[10,3,6],[10,2,6],[10,3,6],
  // Insane (47-60)
  [10,2,7],[10,3,7],[10,2,7],[10,3,7],[10,2,7],
  [10,3,7],[10,2,7],[10,3,7],[10,2,7],[10,3,7],
  [10,2,7],[10,3,7],[10,2,7],[10,3,7],
];

const DIFF = [
  ...Array(10).fill('easy'),
  ...Array(10).fill('medium'),
  ...Array(12).fill('hard'),
  ...Array(14).fill('expert'),
  ...Array(14).fill('insane'),
];

// ── Puzzle generator (reverse-play, guaranteed solvable) ──────────────────────
function clone(arr) { return arr.map(t => [...t]); }

function generatePuzzle(nColors, nEmpty, depth) {
  // Build a pool of all balls: each color appears depth times
  const pool = [];
  for (let c = 0; c < nColors; c++) {
    for (let d = 0; d < depth; d++) pool.push(c);
  }
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // Fill tubes
  const tubes = [];
  for (let c = 0; c < nColors; c++) {
    tubes.push(pool.splice(0, depth));
  }
  for (let e = 0; e < nEmpty; e++) tubes.push([]);

  // Reject if accidentally already solved
  const solved = tubes.slice(0, nColors).every(t => t.every(b => b === t[0]));
  if (solved) return generatePuzzle(nColors, nEmpty, depth);

  return tubes;
}

// ── Game state ─────────────────────────────────────────────────────────────────
const G = {
  level: 0,
  tubes: [],
  initial: [],
  selected: null,
  moves: 0,
  history: [],
  won: false,
  unlocked: 0,
};

// Load progress
try {
  const saved = localStorage.getItem('ballsort_progress');
  if (saved) {
    const p = JSON.parse(saved);
    G.level = p.level || 0;
    G.unlocked = p.unlocked || 0;
  }
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem('ballsort_progress', JSON.stringify({
      level: G.level,
      unlocked: G.unlocked,
    }));
  } catch(e) {}
}

// ── Render ─────────────────────────────────────────────────────────────────────
function isTubeDone(tube) {
  const [nc, , depth] = LEVELS[G.level];
  return tube.length === depth && tube.every(b => b === tube[0]);
}

function render() {
  const area = document.getElementById('game-area');
  area.innerHTML = '';

  G.tubes.forEach((tube, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'tube-wrap';
    if (idx === G.selected) wrap.classList.add('selected');
    if (isTubeDone(tube)) wrap.classList.add('done');

    const div = document.createElement('div');
    div.className = 'tube';

    // Render balls: index 0 = bottom of tube, render top-to-bottom visually
    [...tube].reverse().forEach(colorIdx => {
      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.cssText = ballStyle(colorIdx);
      div.appendChild(ball);
    });

    wrap.appendChild(div);
    wrap.addEventListener('click', () => handleTap(idx));
    area.appendChild(wrap);
  });

  document.getElementById('moves-display').textContent = `moves: ${G.moves}`;
  document.getElementById('level-label').textContent =
    `level ${G.level + 1} / ${LEVELS.length}`;
  const badge = document.getElementById('diff-badge');
  badge.textContent = DIFF[G.level];
  badge.className = `diff-badge ${DIFF[G.level]}`;

  renderLevelSelect();
}

function renderLevelSelect() {
  const sel = document.getElementById('level-select');
  if (!sel.classList.contains('open')) return;
  sel.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    btn.textContent = i + 1;
    if (i === G.level) btn.classList.add('current');
    else if (i <= G.unlocked) btn.classList.add('unlocked');
    else btn.classList.add('locked');
    btn.addEventListener('click', () => {
      if (i <= G.unlocked) {
        G.level = i;
        sel.classList.remove('open');
        startLevel();
      }
    });
    sel.appendChild(btn);
  });
}

let msgTimer = null;
function showMsg(text) {
  const el = document.getElementById('msg-area');
  el.textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.textContent = ''; }, 2200);
}

function shake(idx) {
  const wraps = document.querySelectorAll('.tube-wrap');
  if (wraps[idx]) {
    wraps[idx].classList.remove('shake');
    void wraps[idx].offsetWidth;
    wraps[idx].classList.add('shake');
    wraps[idx].addEventListener('animationend', () => wraps[idx].classList.remove('shake'), { once: true });
  }
}

// ── Tap logic ──────────────────────────────────────────────────────────────────
function validMoves(tubes) {
  const [nc, , depth] = LEVELS[G.level];
  const total = tubes.length;
  const moves = [];
  for (let f = 0; f < total; f++) {
    if (tubes[f].length === 0) continue;
    if (isTubeDone(tubes[f])) continue;
    const ball = tubes[f][tubes[f].length - 1];
    for (let t = 0; t < total; t++) {
      if (t === f) continue;
      if (tubes[t].length >= depth) continue;
      if (tubes[t].length === 0) {
        // Avoid pointless empty→empty style moves
        const allSame = tubes[f].every(b => b === ball);
        if (!allSame) moves.push([f, t]);
      } else {
        if (tubes[t][tubes[t].length - 1] === ball) moves.push([f, t]);
      }
    }
  }
  return moves;
}

function handleTap(idx) {
  if (G.won) return;
  const [nc, , depth] = LEVELS[G.level];

  if (G.selected === null) {
    // First tap: must select a non-empty, non-done tube
    if (G.tubes[idx].length === 0) {
      showMsg('select a tube with balls first');
      return;
    }
    if (isTubeDone(G.tubes[idx])) {
      shake(idx);
      return;
    }
    G.selected = idx;
    render();
    return;
  }

  if (G.selected === idx) {
    G.selected = null;
    render();
    return;
  }

  // Try to move
  const from = G.selected;
  const to = idx;
  const ball = G.tubes[from][G.tubes[from].length - 1];
  const dest = G.tubes[to];

  const canPlace =
    dest.length < depth &&
    (dest.length === 0 || dest[dest.length - 1] === ball);

  if (!canPlace) {
    // Try re-selecting
    if (G.tubes[idx].length > 0 && !isTubeDone(G.tubes[idx])) {
      G.selected = idx;
      render();
    } else {
      shake(idx);
      showMsg("can't place here");
      G.selected = null;
      render();
    }
    return;
  }

  // Execute move — move ALL matching balls from top
  G.history.push({ tubes: clone(G.tubes), moves: G.moves });
  let moved = 0;
  while (
    G.tubes[from].length > 0 &&
    G.tubes[to].length < depth &&
    G.tubes[from][G.tubes[from].length - 1] === ball
  ) {
    G.tubes[to].push(G.tubes[from].pop());
    moved++;
  }
  G.moves++;
  G.selected = null;
  render();

  // Check win
  const [nColors] = LEVELS[G.level];
  const doneTubes = G.tubes.filter(t => t.length > 0).every(t => isTubeDone(t));
  if (doneTubes) {
    G.won = true;
    if (G.level >= G.unlocked && G.level < LEVELS.length - 1) {
      G.unlocked = G.level + 1;
    }
    saveProgress();
    setTimeout(() => {
      document.getElementById('win-title').textContent =
        G.level === LEVELS.length - 1 ? 'all done! 🎉' : 'solved!';
      document.getElementById('win-sub').textContent =
        `${G.moves} move${G.moves !== 1 ? 's' : ''} · level ${G.level + 1}`;
      document.getElementById('win-overlay').classList.add('show');
    }, 420);
    return;
  }

  if (validMoves(G.tubes).length === 0) {
    showMsg('no moves left — undo to continue');
  }
}

// ── Controls ───────────────────────────────────────────────────────────────────
document.getElementById('undo-btn').addEventListener('click', () => {
  if (!G.history.length) { showMsg('nothing to undo'); return; }
  const prev = G.history.pop();
  G.tubes = prev.tubes;
  G.moves = prev.moves;
  G.selected = null;
  G.won = false;
  render();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  G.tubes = clone(G.initial);
  G.moves = 0; G.history = [];
  G.selected = null; G.won = false;
  render();
});

document.getElementById('next-btn').addEventListener('click', () => {
  if (G.level < LEVELS.length - 1) G.level++;
  startLevel();
});

document.getElementById('levels-btn').addEventListener('click', () => {
  const sel = document.getElementById('level-select');
  sel.classList.toggle('open');
  renderLevelSelect();
});

document.getElementById('win-next-btn').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('show');
  if (G.level < LEVELS.length - 1) G.level++;
  startLevel();
});

function startLevel() {
  const [nc, ne, depth] = LEVELS[G.level];
  G.tubes = generatePuzzle(nc, ne, depth);
  G.initial = clone(G.tubes);
  G.selected = null; G.moves = 0;
  G.history = []; G.won = false;
  saveProgress();
  render();
}

startLevel();
</script>
</body>
</html>
